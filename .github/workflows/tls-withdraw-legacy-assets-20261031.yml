name: TLS R17.7 — one-time scoped old Release asset withdrawal
on:
  push:
    branches:
      - security/withdraw-old-suite-assets-20261031
    paths:
      - .github/workflows/tls-withdraw-legacy-assets-20261031.yml
permissions:
  contents: write
jobs:
  withdraw_four_scoped_assets:
    if: github.repository == 'MAX67-gif/Taiwan-LLM-Sanitizer-Traditional_Chinese-zh_tw' && github.ref == 'refs/heads/security/withdraw-old-suite-assets-20261031'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-verify exact Release/asset identity and withdraw four old bundles only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          REPO = "MAX67-gif/Taiwan-LLM-Sanitizer-Traditional_Chinese-zh_tw"
          BRANCH = "refs/heads/security/withdraw-old-suite-assets-20261031"
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          assert os.environ["GITHUB_REF"] == BRANCH
          TOKEN = os.environ["GH_TOKEN"]
          API = "https://api.github.com/repos/" + REPO + "/"

          # A private, pre-existing immutable backup has already been independently
          # SHA-256 verified. Never put the backed-up content in the public repo.
          releases = {
              "all-tools-suite-v17.1.0": {
                  "id": 424925592, "count": 26,
                  "source": "9dcea69bc6357a01e2eb2a60b9da6a9efade9539"},
              "all-tools-suite-v17.2.0": {
                  "id": 425039360, "count": 27,
                  "source": "a1265254f6a8e7d98a9c91d83d74dbf12bf3c4b4"},
              "all-tools-suite-v17.3.0": {
                  "id": 429671776, "count": 28,
                  "source": "b5e1bf0ae7ad63c0e564815d7f0b921187889e2a"},
          }
          withdraw = [
              ("all-tools-suite-v17.1.0", 679998973,
               "TLS_ALL_TOOLS_SUITE_17_1_0.zip", 825580,
               "7f2f589caab6eb91454107382863b59c42c5d98cf18996a04047b6afe5156996"),
              ("all-tools-suite-v17.1.0", 679999006,
               "TLS_DEVELOPER_CLI_SKILL_17_1_0.zip", 486762,
               "5c5761c12282a2c3d2b88b7fb8bf6a44dcd6313ca0f467add5b783ae9667eab7"),
              ("all-tools-suite-v17.2.0", 680453895,
               "TLS_ALL_TOOLS_SUITE_17_2_0.zip", 1098240,
               "2bdfcd69e9ff5d8040bf6e05a44a45b95d6d87ea921b4118eb3122e33e80a1e4"),
              ("all-tools-suite-v17.2.0", 680453920,
               "TLS_DEVELOPER_CLI_SKILL_17_2_0.zip", 733992,
               "feca72e807d42a3252ff5e913587672d79654c56ccc56f31fb7cffd703d5ef0c"),
          ]
          def api(path, method="GET"):
              req = Request(API + path, method=method, headers={
                  "Authorization": "Bearer " + TOKEN,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "TLS-scoped-asset-withdrawal-20261031"})
              try:
                  with urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except HTTPError as e:
                  return e.code, e.read()

          # Verify ALL targets and latest release BEFORE ANY deletion.
          preflight = {}
          for tag, meta in releases.items():
              status, payload = api("releases/tags/" + tag)
              assert status == 200, ("RELEASE_UNAVAILABLE", tag, status)
              actual = json.loads(payload)
              assert actual["id"] == meta["id"]
              assert actual["tag_name"] == tag
              assert actual["target_commitish"] == meta["source"]
              assert actual["draft"] is False and actual["prerelease"] is False
              assert len(actual["assets"]) == meta["count"], ("RELEASE_COUNT_CHANGED", tag)
              preflight[tag] = actual

          status, payload = api("branches/main")
          assert status == 200
          assert json.loads(payload)["commit"]["sha"] == releases["all-tools-suite-v17.3.0"]["source"], "MAIN_CHANGED"

          old_ids = set()
          for tag, asset_id, name, size, sha in withdraw:
              rows = [x for x in preflight[tag]["assets"] if x["id"] == asset_id]
              assert len(rows) == 1, ("ASSET_ID_CHANGED", tag, asset_id)
              asset = rows[0]
              assert asset["name"] == name
              assert asset["size"] == size
              assert asset.get("digest") == "sha256:" + sha
              assert asset["state"] == "uploaded"
              assert asset_id not in old_ids
              old_ids.add(asset_id)

          for asset in preflight["all-tools-suite-v17.3.0"]["assets"]:
              assert asset["id"] not in old_ids
          print("PREFLIGHT_PASS: four exact backed-up asset IDs, tag owners, sizes, digests, latest release and main SHA verified.")

          # No release/tag deletion, no Git history edits, no asset replacement.
          for tag, asset_id, name, size, sha in withdraw:
              status, payload = api("releases/assets/" + str(asset_id), method="DELETE")
              assert status == 204, ("DELETE_REJECTED", asset_id, status, payload[:150])
              status, _ = api("releases/assets/" + str(asset_id))
              assert status == 404, ("ASSET_STILL_AVAILABLE", asset_id, status)
              print("WITHDRAWN_VERIFIED:", tag, asset_id, name)

          for tag, meta in releases.items():
              status, payload = api("releases/tags/" + tag)
              assert status == 200
              after = json.loads(payload)
              assert after["id"] == meta["id"]
              expected_count = meta["count"] - (2 if tag.endswith(("17.1.0", "17.2.0")) else 0)
              assert len(after["assets"]) == expected_count, ("UNEXPECTED_ASSET_COUNT", tag)
              assert not any(a["id"] in old_ids for a in after["assets"])
              assert after["tag_name"] == tag and after["target_commitish"] == meta["source"]
              assert after["draft"] is False
              unchanged = {a["id"]: (a["name"], a["size"], a.get("digest")) for a in preflight[tag]["assets"] if a["id"] not in old_ids}
              current = {a["id"]: (a["name"], a["size"], a.get("digest")) for a in after["assets"]}
              assert current == unchanged, ("OTHER_ASSET_CHANGED", tag)
              print("RELEASE_PRESERVED:", tag, "assets", len(after["assets"]))
          print("SUCCESS: only four specifically approved old assets withdrawn; all three releases and their other assets preserved.")
          PY
