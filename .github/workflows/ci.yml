name: TLS R5 core + R6 quality + R7 demo + R8 context + R9 user choice
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce public-only files and no hidden data upload
        run: |
          python tools/publication_guard.py --self-test
          python tools/publication_guard.py
      - name: Bundle public tracked source for reproducible private handoff
        run: |
          mkdir -p "$RUNNER_TEMP/tls-public-snapshot"
          git archive --format=zip --output="$RUNNER_TEMP/tls-public-snapshot/TLS_PUBLIC_SOURCE_R10_20261024.zip" HEAD
          (cd "$RUNNER_TEMP/tls-public-snapshot" && sha256sum TLS_PUBLIC_SOURCE_R10_20261024.zip > SHA256SUMS.txt)
      - name: Upload versioned public source snapshot (public files only)
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R10_Public_Source_Snapshot
          path: |
            ${{ runner.temp }}/tls-public-snapshot/TLS_PUBLIC_SOURCE_R10_20261024.zip
            ${{ runner.temp }}/tls-public-snapshot/SHA256SUMS.txt
          if-no-files-found: error
      - name: Check Python syntax before any long Chromium run
        run: python -m py_compile tests/*.py tools/*.py
      - name: Check human-readable lexicon and compiled glossary match
        run: python tools/generate_lexicon_r3.py --check
      - name: Validate protected named-entity registry and browser bundle
        run: python tools/generate_names_r5.py --check
      - name: Verify R6 frozen SHA256 and five-family balanced cohort
        run: node tools/r6_benchmark.js validate
      - name: Build reproducible PokéBonk demo ZIP and single-file userscript
        run: python tools/build_pokebonk_demo_r7.py
      - name: Verify PokéBonk committed installers match built output
        run: git diff --exit-code -- dist/pokebonk/chrome dist/pokebonk/TLS_Pokebonk_TW_Demo_R7_1_Tampermonkey_20261024.user.js
      - name: Upload optional R7 site demo installers (display-only, not full game)
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R7_1_Pokebonk_TW_Display_Demo_Installers
          path: |
            dist/pokebonk/TLS_Pokebonk_TW_Demo_R7_1_Chrome_20261024.zip
            dist/pokebonk/TLS_Pokebonk_TW_Demo_R7_1_Tampermonkey_20261024.user.js
            dist/pokebonk/TLS_Pokebonk_TW_Demo_R7_1_SHA256SUMS_20261024.txt
          if-no-files-found: error
      - name: Check R8 contextual review standalone HTML reproducibility
        run: node tools/build_context_review_r8.js --check
      - name: Verify R9 standalone user-choice workbench reproducibility
        run: node tools/build_user_terms_r9.js --check
      - name: Upload R9 offline user-choice HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R9_Taiwan_Term_Choice_Offline_Preview
          path: examples/TW_User_Context_Lab_R9_20261024.html
          if-no-files-found: error
      - name: Run shared engine, CLI and local Provider unit tests
        run: node --test tests/*.js
      - name: Verify user install, ZIP identity and version strings
        run: python tests/test_install_docs_r5.py
      - name: Verify offline public lexicon explorer corpus and privacy
        run: python tests/test_explorer_data_r3.py
      - name: Check local-only privacy and least-privilege contract
        run: python tests/test_privacy_contract_r3.py
      - name: Compute local-only offline term baseline (not model translation quality)
        run: |
          mkdir -p "$RUNNER_TEMP/tls-r6-baseline"
          node tools/r6_benchmark.js baseline --output "$RUNNER_TEMP/tls-r6-baseline/offline_terms.jsonl" --report benchmarks/r6/R6_STRUCTURAL_BASELINE.json
      - name: Build reproducible public frozen quality kit ZIP
        run: python tools/build_r6_quality.py
      - name: Upload standalone R6 public quality kit (not a model leaderboard)
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R6_Public_Quality_Evaluation_Kit_V1
          path: |
            dist/TLS_R6_PUBLIC_QUALITY_KIT_V1_20261024.zip
            dist/TLS_R6_PUBLIC_QUALITY_KIT_V1_20261024.zip.sha256
            benchmarks/r6/R6_STRUCTURAL_BASELINE.json
          if-no-files-found: error
      - name: Build Chrome + single userscript
        run: python tools/build.py
      - name: Verify artifact parity and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          root=Path('src/core')
          chrome=Path('dist/chrome')
          us=Path('dist/userscript/TaiwanLLMSanitizer.user.js').read_text(encoding='utf-8')
          for name in ('lexicon_pack.js','preferences.js','entities.js','engine.js','provider.js','web_adapter.js','progress_ui.js'):
              a=(root/name).read_text(encoding='utf-8')
              assert (chrome/name).read_text(encoding='utf-8')==a, name
              assert a in us, name
          assert us.count('// ==UserScript==')==1
          assert '// @require' not in us and '// @connect' not in us
          meta=json.loads((chrome/'manifest.json').read_text(encoding='utf-8'))
          assert meta['version']=='0.4.0'
          assert meta['manifest_version']==3
          assert 'storage' in meta['permissions']
          with ZipFile('dist/TLS_Chrome_MV3_R5_20261024.zip') as z:
              assert z.testzip() is None
              assert set(z.namelist())=={p.name for p in chrome.iterdir() if p.is_file()}
          print('R5 BUILD/DELIVERY INTEGRITY PASS')
          PY
      - name: Verify committed install files are reproducible
        run: git diff --exit-code -- dist/chrome dist/userscript
      - name: JavaScript syntax checks
        run: |
          for f in src/core/*.js src/chrome/*.js src/userscript/*.js dist/chrome/*.js dist/userscript/*.js tools/*.js; do node --check "$f"; done
      - name: Upload Chrome and Userscript install bundles
        uses: actions/upload-artifact@v4
        with:
          name: Taiwan-LLM-Sanitizer-R5-Install
          path: |
            dist/TLS_Chrome_MV3_R5_20261024.zip
            dist/userscript/TaiwanLLMSanitizer.user.js
            dist/TLS_Tampermonkey_R5_20261024.user.js
            dist/SHA256SUMS_R5_20261024.txt
          if-no-files-found: error

  browser-integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/build.py
      - run: python tests/test_browser.py
      - run: python tests/test_browser_r2.py
      - run: python tests/test_userscript_browser.py
      - run: python tests/test_popup_r2.py
      - run: python tests/test_browser_lexicon_r3.py
      - run: python tests/test_explorer_browser_r3.py
      - run: python tests/test_context_review_r8.py
      - run: python tests/test_user_terms_browser_r9.py
      - run: python tests/test_visual_progress_browser_r5.py
      - run: python tests/test_r6_browser.py
      - run: python tools/build_pokebonk_demo_r7.py
      - run: python tests/test_pokebonk_demo_r7.py
 
  release:
    name: Publish one public installer release per version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - name: Publish ZIP and standalone userscript only after tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.4.0" >/dev/null 2>&1; then
            echo "v0.4.0 already published; do not overwrite release files"
          else
            gh release create "v0.4.0"               dist/TLS_Chrome_MV3_R5_20261024.zip               dist/TLS_Tampermonkey_R5_20261024.user.js               dist/SHA256SUMS_R5_20261024.txt               --target "$GITHUB_SHA"               --title "Taiwan-LLM-Sanitizer v0.4.0 (R5 Preview)"               --notes "R5: keep Codex for Open Source and AI brand names intact; provide visual progress, portable Codex/Claude skills and fixed controls. Chrome ZIP: extract, then use chrome://extensions > Load unpacked. Tampermonkey: import the standalone .user.js. On-device model availability varies. Not Chrome Web Store reviewed. Source text is not sent by this extension to our servers."
          fi

  r6-quality-release:
    name: Publish R6 public quality evaluation kit only
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen input and construct reproducible study kit
        run: python tools/build_r6_quality.py
      - name: Create distinct R6 evaluation-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "r6-quality-v1" >/dev/null 2>&1; then
            echo "R6 quality release exists; never silently replace a frozen dataset."
          else
            gh release create "r6-quality-v1" \
              "dist/TLS_R6_PUBLIC_QUALITY_KIT_V1_20261024.zip" \
              "dist/TLS_R6_PUBLIC_QUALITY_KIT_V1_20261024.zip.sha256" \
              --target "$GITHUB_SHA" \
              --title "R6 臺灣自然中文品質評測工具包（100 題公開凍結版）" \
              --notes "Evaluation-only public toolkit: 100 original editorial test cases in five domains, SHA256 freeze, offline structural QA, human review rubric, bilingual review page and optional Chrome built-in Translator runner. No independent real-model quality result has been established. This release does not change R5 browser runtime v0.4.0. No automatic uploading of user texts."
          fi

  r7-pokebonk-demo-release:
    name: Publish separate optional PokéBonk display demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_pokebonk_demo_r7.py
      - name: Publish only manually opt-in display layer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "r7-pokebonk-demo-0.1.1" >/dev/null 2>&1; then
            echo "Demo release already exists, do not replace prior assets."
          else
            gh release create "r7-pokebonk-demo-0.1.1" \
              dist/pokebonk/TLS_Pokebonk_TW_Demo_R7_1_Chrome_20261024.zip \
              dist/pokebonk/TLS_Pokebonk_TW_Demo_R7_1_Tampermonkey_20261024.user.js \
              dist/pokebonk/TLS_Pokebonk_TW_Demo_R7_1_SHA256SUMS_20261024.txt \
              --target "$GITHUB_SHA" \
              --title "R7.1 PokéBonk 臺灣用語（非官方、顯示層試玩版）" \
              --notes "R7.1 patch: shared text/attribute exclusion checks and hidden-content regression; older 0.1.0 frozen. Explicit opt-in, 136 illustrative terms. Real-site permission and end-to-end compatibility not established. Not an official Pokémon or PokéBonk product. DOES NOT modify the game's canvas/WebGL, account, save, combat, network or hidden game state. Real current-site compatibility and the game's Terms must be assessed by the user. General TLS R5 extension and R6 evaluator remain unchanged."
          fi

  r8-context-review-release:
    name: Publish R8 offline term review as standalone downloadable HTML
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shipped R8 HTML is built deterministically
        run: node tools/build_context_review_r8.js --check
      - name: Create checksum for the exact standalone download
        run: |
          cp examples/TW_Context_Review_Lab_R8_20261024.html TLS_Taiwan_Context_Review_R8_20261024.html
          sha256sum TLS_Taiwan_Context_Review_R8_20261024.html > TLS_Taiwan_Context_Review_R8_20261024.sha256
      - name: Publish immutable standalone review workbench
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "r8-context-review-preview-0.1.0" >/dev/null 2>&1; then
            echo "R8 preview release exists; never silently replace a published artifact"
          else
            gh release create "r8-context-review-preview-0.1.0" \
              TLS_Taiwan_Context_Review_R8_20261024.html \
              TLS_Taiwan_Context_Review_R8_20261024.sha256 \
              --target "$GITHUB_SHA" \
              --title "R8 臺灣用語離線語境審查工作台（建議模式）" \
              --notes "Download the standalone HTML and open it locally in a browser. No install, API key, network, or account is needed. It reviews 883 unverified candidate terms and 67 editorial seeds without automatic text replacement. This preview is NOT a neural translator, validated market benchmark, or official language standard. R5 browser runtime and R6 frozen study cohort remain unchanged."
          fi

  r9-user-terms-release:
    name: Publish independent R9 Taiwan user-word choice offline HTML
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build_user_terms_r9.js --check
      - name: Publish without overwriting any earlier release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum examples/TW_User_Context_Lab_R9_20261024.html > examples/TW_User_Context_Lab_R9_20261024.html.sha256
          if gh release view "r9-user-terms-preview-v1" >/dev/null 2>&1; then
            echo "Existing R9 release is immutable; skip overwrite"
          else
            gh release create "r9-user-terms-preview-v1" \
              examples/TW_User_Context_Lab_R9_20261024.html \
              examples/TW_User_Context_Lab_R9_20261024.html.sha256 \
              --target "$GITHUB_SHA" \
              --title "R9 臺灣用語自行選詞與原文對照（完全本機單檔）" \
              --notes "Offline HTML only: manual context choice, original-vs-preview diff and portable user term JSON. User preferences are never silently uploaded; source text is not saved. R5 core, R6 frozen benchmark, R7.1 and R8 remain separate. The 28 editorial cases are not independently verified."
          fi
