name: R5 named entities, fixed translation progress and agent skills
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce public-only files and no hidden data upload
        run: |
          python tools/publication_guard.py --self-test
          python tools/publication_guard.py
      - name: Check Python syntax before any long Chromium run
        run: python -m py_compile tests/*.py tools/*.py
      - name: Check human-readable lexicon and compiled glossary match
        run: python tools/generate_lexicon_r3.py --check
      - name: Validate protected named-entity registry and browser bundle
        run: python tools/generate_names_r5.py --check
      - name: Verify R6 frozen SHA256 and five-family balanced cohort
        run: node tools/r6_benchmark.js validate
      - name: Run shared engine, CLI and local Provider unit tests
        run: node --test tests/*.js
      - name: Verify user install, ZIP identity and version strings
        run: python tests/test_install_docs_r5.py
      - name: Verify offline public lexicon explorer corpus and privacy
        run: python tests/test_explorer_data_r3.py
      - name: Check local-only privacy and least-privilege contract
        run: python tests/test_privacy_contract_r3.py
      - name: Build Chrome + single userscript
        run: python tools/build.py
      - name: Verify artifact parity and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          root=Path('src/core')
          chrome=Path('dist/chrome')
          us=Path('dist/userscript/TaiwanLLMSanitizer.user.js').read_text(encoding='utf-8')
          for name in ('lexicon_pack.js','preferences.js','entities.js','engine.js','provider.js','web_adapter.js','progress_ui.js'):
              a=(root/name).read_text(encoding='utf-8')
              assert (chrome/name).read_text(encoding='utf-8')==a, name
              assert a in us, name
          assert us.count('// ==UserScript==')==1
          assert '// @require' not in us and '// @connect' not in us
          meta=json.loads((chrome/'manifest.json').read_text(encoding='utf-8'))
          assert meta['version']=='0.4.0'
          assert meta['manifest_version']==3
          assert 'storage' in meta['permissions']
          with ZipFile('dist/TLS_Chrome_MV3_R5_20261024.zip') as z:
              assert z.testzip() is None
              assert set(z.namelist())=={p.name for p in chrome.iterdir() if p.is_file()}
          print('R5 BUILD/DELIVERY INTEGRITY PASS')
          PY
      - name: Verify committed install files are reproducible
        run: git diff --exit-code -- dist/chrome dist/userscript
      - name: JavaScript syntax checks
        run: |
          for f in src/core/*.js src/chrome/*.js src/userscript/*.js dist/chrome/*.js dist/userscript/*.js tools/*.js; do node --check "$f"; done
      - name: Upload Chrome and Userscript install bundles
        uses: actions/upload-artifact@v4
        with:
          name: Taiwan-LLM-Sanitizer-R5-Install
          path: |
            dist/TLS_Chrome_MV3_R5_20261024.zip
            dist/userscript/TaiwanLLMSanitizer.user.js
            dist/TLS_Tampermonkey_R5_20261024.user.js
            dist/SHA256SUMS_R5_20261024.txt
          if-no-files-found: error

  browser-integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/build.py
      - run: python tests/test_browser.py
      - run: python tests/test_browser_r2.py
      - run: python tests/test_userscript_browser.py
      - run: python tests/test_popup_r2.py
      - run: python tests/test_browser_lexicon_r3.py
      - run: python tests/test_explorer_browser_r3.py
      - run: python tests/test_visual_progress_browser_r5.py
      - run: python tests/test_r6_browser.py
 
  release:
    name: Publish one public installer release per version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - name: Publish ZIP and standalone userscript only after tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.4.0" >/dev/null 2>&1; then
            echo "v0.4.0 already published; do not overwrite release files"
          else
            gh release create "v0.4.0"               dist/TLS_Chrome_MV3_R5_20261024.zip               dist/TLS_Tampermonkey_R5_20261024.user.js               dist/SHA256SUMS_R5_20261024.txt               --target "$GITHUB_SHA"               --title "Taiwan-LLM-Sanitizer v0.4.0 (R5 Preview)"               --notes "R5: keep Codex for Open Source and AI brand names intact; provide visual progress, portable Codex/Claude skills and fixed controls. Chrome ZIP: extract, then use chrome://extensions > Load unpacked. Tampermonkey: import the standalone .user.js. On-device model availability varies. Not Chrome Web Store reviewed. Source text is not sent by this extension to our servers."
          fi
