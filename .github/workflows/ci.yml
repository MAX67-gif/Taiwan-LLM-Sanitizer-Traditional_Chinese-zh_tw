  all-tools-full-suite-release:
    name: Full-Suite Release Gate (publish only when the product changes)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tls-all-tools-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decide whether this main commit is an explicitly allowlisted R17.3 research-only delta
        id: r173_scope
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          python tools/check_r173_research_scope.py --base "$BASE_SHA" --head "$GITHUB_SHA"
      - name: Fail closed if any pinned original release asset is missing or modified
        if: steps.r173_scope.outputs.product_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Fetch ONLY the approved public prior Releases, never private/quarantined assets.
          python tools/build_all_tools_release.py \
            --cache "$RUNNER_TEMP/tls_all_tools_original_assets" \
            --stage "$RUNNER_TEMP/tls_all_tools_stage" \
            --source-sha "$GITHUB_SHA" --fetch-official
          python tools/check_all_tools_release.py \
            --stage "$RUNNER_TEMP/tls_all_tools_stage" \
            --expected-sha "$GITHUB_SHA" --check-workflow
      - name: Verify Draft downloads, publish once, and verify fresh published downloads
        if: steps.r173_scope.outputs.product_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/publish_all_tools_release.py \
            --stage "$RUNNER_TEMP/tls_all_tools_stage" \
            --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/tls_all_tools_publication_receipt.json"
      - name: Verify prior immutable Suite stays published when only R17.3 research changes
        if: steps.r173_scope.outputs.research_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "all-tools-suite-v17.2.0" --json tagName,isDraft,targetCommitish,assets > "$RUNNER_TEMP/tls-r173-existing-release.json"
          python tools/check_r173_research_scope.py \
            --existing-release-json "$RUNNER_TEMP/tls-r173-existing-release.json" \
            --receipt "$RUNNER_TEMP/tls_all_tools_publication_receipt.json"
      - name: Preserve verified publication outcome or blocking reason
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TLS_All_Tools_Publication_Receipt
          path: ${{ runner.temp }}/tls_all_tools_publication_receipt.json
          if-no-files-found: warn
