name: TLS complete All-Tools release, frozen runtimes and third-party rights guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce public-only files and no hidden data upload
        run: |
          python tools/publication_guard.py --self-test
          python tools/publication_guard.py
          python tests/test_public_rights_withdrawal.py
      - name: Verify multilingual README source sync and third-party rights
        run: |
          python tools/check_readme_i18n.py --self-test
          python tools/check_readme_i18n.py
          python tools/check_examples_i18n.py --self-test
          python tools/check_examples_i18n.py
      - name: Preflight All-Tools registry, fail-closed suite completeness and immutable publishing gates
        run: |
          python -m unittest discover -s tests -p 'test_all_tools*.py' -v
          python tools/check_all_tools_release.py --check-workflow
      - name: Check Python syntax before any long Chromium run
        run: python -m py_compile tests/*.py tools/*.py
      - name: Fail fast on R11 release shell syntax (before expensive browser checks)
        run: python tools/check_release_workflow_r11.py
      - name: Fail fast on R12 Release Bash syntax and dual-job gating
        run: python tools/check_r12_release_workflow.py
      - name: Validate R13 Release Bash and official CI gates before expensive tests
        run: python tools/check_release_workflow_r13.py
      - name: Verify R15 standalone structure-protection lab and CLI
        run: |
          node tools/build_structured_integrity_r15.js --check
          node tools/r15_structured_localizer_cli.js --input tests/fixtures/r15/original_markdown.md --format markdown --report "$RUNNER_TEMP/tls-r15-report.json"
          python tools/check_release_workflow_r15.py
      - name: Verify R15.1 HTML/URL counterexample safety, immutable old release and CI schema
        run: |
          node tools/build_structured_integrity_r151.js --check
          python tools/check_release_workflow_r151.py
      - name: Validate R16 offline safety studio and versioned release contract
        run: |
          node tools/build_local_workbench_r16.js --check
          python tools/check_release_workflow_r16.py
      - name: Check R17.2 same-source offline wording assistant and AI onboarding
        run: |
          node tools/build_wording_assistant_r172.js --check
          node --test tests/test_wording_assistant_r172.js
          python tools/build_start_here_r172.py
          python -m unittest tests/test_r172_suite_monotonic.py -v
      - name: Validate R17.3 fairness research sidecar (not model/human performance)
        run: |
          node --check research/comparison/r173/naive_baseline.js
          node --check research/comparison/r173/prepare_spans.js
          node --test tests/test_comparison_r173.js
          python -m unittest tests/test_comparison_r173.py -v
          python -m unittest tests/test_r173_research_scope.py -v
          python -m py_compile research/comparison/r173/*.py tools/check_r173_research_scope.py
          node research/comparison/r173/naive_baseline.js --input research/comparison/r173/fixtures_first_task.md > "$RUNNER_TEMP/tls-r173-dev-only.json"
      - name: Verify R17 project-level read-only Markdown integrity toolkit
        run: |
          node tools/build_document_trust_r17.js --check
          node --test tests/test_document_trust_graph_r17.js
          python tools/check_r17_docs_i18n.py
          python tools/check_release_workflow_r17.py
          node tools/r17_document_trust_cli.js --root examples/r17/demo --allowlist examples/r17/allowlist.json --report "$RUNNER_TEMP/tls-r17-audit.json"
      - name: Upload R17 independent metadata-only offline tool
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R17_Offline_Document_Trust_Graph_Preview
          path: examples/TW_Document_Trust_Graph_R17_20261026.html
          if-no-files-found: error
      - name: Publish only original R16 standalone HTML as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-r16-standalone-original-preview
          path: examples/TW_Localization_Safety_Studio_R16_20261026.html
          if-no-files-found: error
      - name: Upload R15 original-only structural safety lab
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R15_Standalone_Offline_Structure_Review
          path: examples/TW_Structured_Integrity_Lab_R15_20261025.html
          if-no-files-found: error
      - name: Verify R14 independent no-transport Provider decision preview
        run: |
          node tools/build_provider_capability_r14.js --check
          node tools/r14_capability_cli.js --input examples/TLS_R14_Provider_Capability_Demo_20261025.json > "$RUNNER_TEMP/tls-r14-capability.json"
          python tools/check_release_workflow_r14.py
      - name: Upload R14 offline capability report preview (no user text)
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R14_Offline_Provider_Capability_Lab
          path: examples/TW_Provider_Capability_Lab_R14_20261025.html
          if-no-files-found: error
      - name: Build/check R13 separate Chrome and Tampermonkey installers
        run: |
          python tools/build_r13.py
          python tools/build_r13.py --check
          python tests/test_install_r13.py
      - name: Upload optional R13 read-only bilingual preview installers
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R13_Read_Only_Bilingual_Installers
          path: |
            dist/r13/TLS_Chrome_MV3_R13_20261025.zip
            dist/r13/TLS_Tampermonkey_R13_20261025.user.js
            dist/r13/SHA256SUMS_R13_20261025.txt
          if-no-files-found: error
      - name: Check human-readable lexicon and compiled glossary match
        run: python tools/generate_lexicon_r3.py --check
      - name: Validate protected named-entity registry and browser bundle
        run: python tools/generate_names_r5.py --check
      - name: Verify R6 frozen SHA256 and five-family balanced cohort
        run: node tools/r6_benchmark.js validate
      - name: Check R8 contextual review standalone HTML reproducibility
        run: node tools/build_context_review_r8.js --check
      - name: Verify R9 standalone user-choice workbench reproducibility
        run: node tools/build_user_terms_r9.js --check
      - name: Verify R10 original-context provenance, strict schema and reproducible offline page
        run: node tools/build_context_governance_r10.js --check
      - name: Verify R12 offline quality evidence HTML against frozen R6 source
        run: node tools/build_quality_audit_r12.js --check
      - name: Upload R12 research-only HTML for reviewer convenience
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R12_Offline_Quality_Evidence_Lab
          path: examples/TW_Quality_Audit_Lab_R12_20261025.html
          if-no-files-found: error
      - name: Upload R10 safe offline provenance review page
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R10_Context_Provenance_Offline_Review
          path: |
            examples/TW_Context_Governance_Lab_R10_20261024.html
            lexicon/context_provenance_r10_manifest.json
          if-no-files-found: error
      - name: Upload R9 offline user-choice HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R9_Taiwan_Term_Choice_Offline_Preview
          path: examples/TW_User_Context_Lab_R9_20261024.html
          if-no-files-found: error
      - name: Run shared engine, CLI and local Provider unit tests
        run: node --test tests/*.js
      - name: Verify user install, ZIP identity and version strings
        run: python tests/test_install_docs_r5.py
      - name: Verify offline public lexicon explorer corpus and privacy
        run: python tests/test_explorer_data_r3.py
      - name: Check local-only privacy and least-privilege contract
        run: python tests/test_privacy_contract_r3.py
      - name: Compute local-only offline term baseline (not model translation quality)
        run: |
          mkdir -p "$RUNNER_TEMP/tls-r6-baseline"
          node tools/r6_benchmark.js baseline --output "$RUNNER_TEMP/tls-r6-baseline/offline_terms.jsonl" --report benchmarks/r6/R6_STRUCTURAL_BASELINE.json
      - name: Build reproducible public frozen quality kit ZIP
        run: python tools/build_r6_quality.py
      - name: Upload standalone R6 public quality kit (not a model leaderboard)
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R6_Public_Quality_Evaluation_Kit_V1
          path: |
            dist/TLS_R6_PUBLIC_QUALITY_KIT_V1_20261024.zip
            dist/TLS_R6_PUBLIC_QUALITY_KIT_V1_20261024.zip.sha256
            benchmarks/r6/R6_STRUCTURAL_BASELINE.json
          if-no-files-found: error
      - name: Build Chrome + single userscript
        run: python tools/build.py
      - name: Verify artifact parity and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          root=Path('src/core')
          chrome=Path('dist/chrome')
          us=Path('dist/userscript/TaiwanLLMSanitizer.user.js').read_text(encoding='utf-8')
          for name in ('lexicon_pack.js','preferences.js','entities.js','engine.js','provider.js','web_adapter.js','progress_ui.js'):
              a=(root/name).read_text(encoding='utf-8')
              assert (chrome/name).read_text(encoding='utf-8')==a, name
              assert a in us, name
          assert us.count('// ==UserScript==')==1
          assert '// @require' not in us and '// @connect' not in us
          meta=json.loads((chrome/'manifest.json').read_text(encoding='utf-8'))
          assert meta['version']=='0.4.0'
          assert meta['manifest_version']==3
          assert 'storage' in meta['permissions']
          with ZipFile('dist/TLS_Chrome_MV3_R5_20261024.zip') as z:
              assert z.testzip() is None
              assert set(z.namelist())=={p.name for p in chrome.iterdir() if p.is_file()}
          print('R5 BUILD/DELIVERY INTEGRITY PASS')
          PY
      - name: Verify committed install files are reproducible
        run: git diff --exit-code -- dist/chrome dist/userscript
      - name: JavaScript syntax checks
        run: |
          for f in src/core/*.js src/chrome/*.js src/userscript/*.js src/r13/chrome/*.js src/r13/userscript/*.js src/r13/*.js dist/chrome/*.js dist/userscript/*.js dist/r13/chrome/*.js dist/r13/userscript/*.js tools/*.js; do node --check "$f"; done
      - name: Upload Chrome and Userscript install bundles
        uses: actions/upload-artifact@v4
        with:
          name: Taiwan-LLM-Sanitizer-R5-Install
          path: |
            dist/TLS_Chrome_MV3_R5_20261024.zip
            dist/userscript/TaiwanLLMSanitizer.user.js
            dist/TLS_Tampermonkey_R5_20261024.user.js
            dist/SHA256SUMS_R5_20261024.txt
          if-no-files-found: error

      - name: Build optional R11 Chrome and standalone Tampermonkey from R5 shared source
        run: |
          python tools/build_r11.py
          python tools/build_r11.py --check
      - name: Check R11 tracked install files reproducible and public runtime privacy
        run: |
          git diff --exit-code -- dist/r11/chrome dist/r11/userscript
          python tests/test_install_r11.py
          for f in src/r11/chrome/*.js src/r11/userscript/*.js dist/r11/chrome/*.js dist/r11/userscript/*.js; do node --check "$f"; done
      - name: Upload separate R11 optional preview installers
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R11_Optional_Manual_Site_Glossary_Installers
          path: |
            dist/r11/TLS_Chrome_MV3_R11_20261025.zip
            dist/r11/TLS_Tampermonkey_R11_20261025.user.js
            dist/r11/SHA256SUMS_R11_20261025.txt
          if-no-files-found: error

      - name: Build and verify production All-Tools suite from the checked-out commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # PR merge refs and main builds must name their actual checked-out source.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/build_all_tools_release.py \
            --cache "$RUNNER_TEMP/tls_all_tools_verify_original_assets" \
            --stage "$RUNNER_TEMP/tls_all_tools_verify_stage" \
            --source-sha "$GITHUB_SHA" --fetch-official
          python tools/check_all_tools_release.py \
            --stage "$RUNNER_TEMP/tls_all_tools_verify_stage" \
            --expected-sha "$GITHUB_SHA" --check-workflow

      - name: Bundle public tracked source for reproducible private handoff
        run: |
          mkdir -p "$RUNNER_TEMP/tls-public-snapshot"
          git archive --format=zip --output="$RUNNER_TEMP/tls-public-snapshot/TLS_PUBLIC_SOURCE_R10_20261024.zip" HEAD
          (cd "$RUNNER_TEMP/tls-public-snapshot" && sha256sum TLS_PUBLIC_SOURCE_R10_20261024.zip > SHA256SUMS.txt)
      - name: Upload versioned public source snapshot (public files only)
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R10_Public_Source_Snapshot
          path: |
            ${{ runner.temp }}/tls-public-snapshot/TLS_PUBLIC_SOURCE_R10_20261024.zip
            ${{ runner.temp }}/tls-public-snapshot/SHA256SUMS.txt
          if-no-files-found: error

      - name: Preserve exact public-only R12 source snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/tls-r12-source"
          git archive --format=zip --output="$RUNNER_TEMP/tls-r12-source/TLS_R12_PUBLIC_SOURCE_20261025.zip" HEAD
          (cd "$RUNNER_TEMP/tls-r12-source" && sha256sum TLS_R12_PUBLIC_SOURCE_20261025.zip > SHA256SUMS.txt)
      - name: Upload source archive and digest for complete source handoff
        uses: actions/upload-artifact@v4
        with:
          name: TLS_R12_Public_Source_Full_Snapshot
          path: |
            ${{ runner.temp }}/tls-r12-source/TLS_R12_PUBLIC_SOURCE_20261025.zip
            ${{ runner.temp }}/tls-r12-source/SHA256SUMS.txt
          if-no-files-found: error

  browser-integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/build.py
      - run: python tests/test_browser.py
      - run: python tests/test_browser_r2.py
      - run: python tests/test_userscript_browser.py
      - run: python tests/test_popup_r2.py
      - run: python tests/test_browser_lexicon_r3.py
      - run: python tests/test_explorer_browser_r3.py
      - run: python tests/test_context_review_r8.py
      - run: python tests/test_user_terms_browser_r9.py
      - run: python tests/test_context_governance_browser_r10.py
      - run: python tools/build_r11.py
      - run: python tests/test_site_glossary_browser_r11.py
      - run: python tests/test_popup_browser_r11.py
      - run: python tests/test_userscript_browser_r11.py
      - run: python tests/test_quality_audit_browser_r12.py
      - run: python tests/test_visual_progress_browser_r5.py
      - name: Test R15 standalone HTML in real Chromium, no external network
        run: python tests/test_structured_integrity_browser_r15.py
      - name: Test R15.1 HTML raw blocks, balanced URLs and GFM in real Chromium
        run: python tests/test_structured_integrity_browser_r151.py
      - name: Test R17 explicitly authorized offline folder audit in Chromium
        run: python tests/test_document_trust_browser_r17.py
      - name: Test R17.2 real Chromium offline selection and download
        run: python tests/test_wording_assistant_browser_r172.py
      - name: Test R16 standalone offline Studio in real Chromium and mobile layout
        run: python tests/test_local_workbench_browser_r16.py
      - name: Verify R14 offline Provider capability UI, consent and no egress in Chromium
        run: python tests/test_provider_capability_browser_r14.py
      - name: Test R13 closed-shadow selection, code protection and no network in Chromium
        run: python tests/test_bilingual_reader_browser_r13.py
      - run: python tests/test_r6_browser.py
 
  # HISTORICAL RELEASE JOBS ARE PERMANENTLY DISABLED FOR NEW PUBLISHING.
  # Their old tags/assets remain available; only the central Full Suite job publishes new versions.
  release:
    name: Publish one public installer release per version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - name: Publish ZIP and standalone userscript only after tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.4.0" >/dev/null 2>&1; then
            echo "v0.4.0 already published; do not overwrite release files"
          else
            gh release create "v0.4.0"               dist/TLS_Chrome_MV3_R5_20261024.zip               dist/TLS_Tampermonkey_R5_20261024.user.js               dist/SHA256SUMS_R5_20261024.txt               --target "$GITHUB_SHA"               --title "Taiwan-LLM-Sanitizer v0.4.0 (R5 Preview)"               --notes "R5: keep Codex for Open Source and AI brand names intact; provide visual progress, portable Codex/Claude skills and fixed controls. Chrome ZIP: extract, then use chrome://extensions > Load unpacked. Tampermonkey: import the standalone .user.js. On-device model availability varies. Not Chrome Web Store reviewed. Source text is not sent by this extension to our servers."
          fi

  r6-quality-release:
    name: Publish R6 public quality evaluation kit only
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen input and construct reproducible study kit
        run: python tools/build_r6_quality.py
      - name: Create distinct R6 evaluation-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "r6-quality-v1" >/dev/null 2>&1; then
            echo "R6 quality release exists; never silently replace a frozen dataset."
          else
            gh release create "r6-quality-v1" \
              "dist/TLS_R6_PUBLIC_QUALITY_KIT_V1_20261024.zip" \
              "dist/TLS_R6_PUBLIC_QUALITY_KIT_V1_20261024.zip.sha256" \
              --target "$GITHUB_SHA" \
              --title "R6 臺灣自然中文品質評測工具包（100 題公開凍結版）" \
              --notes "Evaluation-only public toolkit: 100 original editorial test cases in five domains, SHA256 freeze, offline structural QA, human review rubric, bilingual review page and optional Chrome built-in Translator runner. No independent real-model quality result has been established. This release does not change R5 browser runtime v0.4.0. No automatic uploading of user texts."
          fi

  r8-context-review-release:
    name: Publish R8 offline term review as standalone downloadable HTML
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shipped R8 HTML is built deterministically
        run: node tools/build_context_review_r8.js --check
      - name: Create checksum for the exact standalone download
        run: |
          cp examples/TW_Context_Review_Lab_R8_20261024.html TLS_Taiwan_Context_Review_R8_20261024.html
          sha256sum TLS_Taiwan_Context_Review_R8_20261024.html > TLS_Taiwan_Context_Review_R8_20261024.sha256
      - name: Publish immutable standalone review workbench
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "r8-context-review-preview-0.1.0" >/dev/null 2>&1; then
            echo "R8 preview release exists; never silently replace a published artifact"
          else
            gh release create "r8-context-review-preview-0.1.0" \
              TLS_Taiwan_Context_Review_R8_20261024.html \
              TLS_Taiwan_Context_Review_R8_20261024.sha256 \
              --target "$GITHUB_SHA" \
              --title "R8 臺灣用語離線語境審查工作台（建議模式）" \
              --notes "Download the standalone HTML and open it locally in a browser. No install, API key, network, or account is needed. It reviews 883 unverified candidate terms and 67 editorial seeds without automatic text replacement. This preview is NOT a neural translator, validated market benchmark, or official language standard. R5 browser runtime and R6 frozen study cohort remain unchanged."
          fi

  r9-user-terms-release:
    name: Publish independent R9 Taiwan user-word choice offline HTML
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build_user_terms_r9.js --check
      - name: Publish without overwriting any earlier release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum examples/TW_User_Context_Lab_R9_20261024.html > examples/TW_User_Context_Lab_R9_20261024.html.sha256
          if gh release view "r9-user-terms-preview-v1" >/dev/null 2>&1; then
            echo "Existing R9 release is immutable; skip overwrite"
          else
            gh release create "r9-user-terms-preview-v1" \
              examples/TW_User_Context_Lab_R9_20261024.html \
              examples/TW_User_Context_Lab_R9_20261024.html.sha256 \
              --target "$GITHUB_SHA" \
              --title "R9 臺灣用語自行選詞與原文對照（完全本機單檔）" \
              --notes "Offline HTML only: manual context choice, original-vs-preview diff and portable user term JSON. User preferences are never silently uploaded; source text is not saved. R5 core, R6 frozen benchmark, R7.1 and R8 remain separate. The 28 editorial cases are not independently verified."
          fi

  r10-context-governance-release:
    name: Publish R10 standalone provenance review after full regressions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify R10 content and SHA-bound review pack
        run: node tools/build_context_governance_r10.js --check
      - name: Create immutable and independently downloadable R10 HTML asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp examples/TW_Context_Governance_Lab_R10_20261024.html TLS_Context_Governance_R10_20261024.html
          sha256sum TLS_Context_Governance_R10_20261024.html > TLS_Context_Governance_R10_20261024.sha256
          if gh release view "r10-context-governance-preview-v1" >/dev/null 2>&1; then
            echo "R10 preview already exists; published assets must not be overwritten"
          else
            gh release create "r10-context-governance-preview-v1" \
              TLS_Context_Governance_R10_20261024.html \
              TLS_Context_Governance_R10_20261024.sha256 \
              --target "$GITHUB_SHA" \
              --title "R10 臺灣語境來源追溯與反例人工審查（離線獨立預覽）" \
              --notes "40 project-original editorial context cases (28 exact R9 references + 12 new), 0 independently verified. Offline SHA-bound voluntary manual decisions and JSON export/import, no external content transfer, no auto-apply, no website modification. R5/R6/R7.1/R8/R9 unchanged."
          fi

  r11-personal-glossary-release:
    name: Publish R11 manual site glossary only after complete regression pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild, check exact version and SHA
        run: |
          python tools/build_r11.py
