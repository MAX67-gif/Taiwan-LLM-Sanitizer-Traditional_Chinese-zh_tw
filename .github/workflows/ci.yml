  r14-capability-release:
    name: Publish R14 offline capability lab (not model/provider integration)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published HTML exactly matches original source
        run: node tools/build_provider_capability_r14.js --check
      - name: Publish immutable R14 offline capability preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum examples/TW_Provider_Capability_Lab_R14_20261025.html > examples/TW_Provider_Capability_Lab_R14_20261025.html.sha256
          if gh release view "r14-provider-capability-preview-0.1.0" >/dev/null 2>&1; then
            echo "R14 release already exists: do not replace previously published assets."
          else
            gh release create "r14-provider-capability-preview-0.1.0" \
              examples/TW_Provider_Capability_Lab_R14_20261025.html \
              examples/TW_Provider_Capability_Lab_R14_20261025.html.sha256 \
              --target "$GITHUB_SHA" \
              --title "R14 本機 Provider 能力與授權判定（獨立離線研究工具）" \
              --notes "Standalone offline capability/consent explanation, not a translation engine. All remote providers remain disabled; no text egress or telemetry. Provider availability is a simulated declaration and not actual device-model verification. R5/R11/R13 installers and R6 frozen dataset are unchanged. Download the HTML locally and verify SHA256."
          fi

