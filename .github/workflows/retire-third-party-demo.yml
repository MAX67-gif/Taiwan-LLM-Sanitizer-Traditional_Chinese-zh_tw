name: Retire previously released third-party game demo assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-third-party-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retire-exact-releases:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Remove only approved legacy example Releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in 'r7-pokebonk-demo-0.1.0' 'r7-pokebonk-demo-0.1.1' 'r7-pokebonk-demo-0.1.2'; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "Retired one previously published third-party demo release."
            fi
          done
          # Recheck exact names. A missing item is expected. Do not alter any other tag or release.
          for tag in 'r7-pokebonk-demo-0.1.0' 'r7-pokebonk-demo-0.1.1' 'r7-pokebonk-demo-0.1.2'; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "ERROR: legacy asset remains published." >&2
              exit 1
            fi
          done
      - name: Remove only archived site-specific Actions build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | ascii_downcase | contains("pokebonk")) | .id' | \
          while IFS= read -r artifact_id; do
            if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done
