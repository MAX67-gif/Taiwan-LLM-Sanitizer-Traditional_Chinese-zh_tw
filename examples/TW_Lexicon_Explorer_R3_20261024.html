<script>
(function(){
'use strict';
const data=JSON.parse(document.getElementById('data').textContent);
const $=(id)=>document.getElementById(id);
const domains=Array.from(new Set(data.entries.map(x=>x.domain))).sort();
for(const d of domains){const option=document.createElement('option');option.value=d;option.textContent=d;$('domain').appendChild(option);}
let page=0,filtered=[];
function filter(){
 const q=$('q').value.trim().toLocaleLowerCase('zh-Hant');
 const domain=$('domain').value;
 const active=$('status').value==='approved';
 const pool=active?data.approved:data.entries;
 filtered=pool.filter(x=>(!domain||x.domain===domain) &&
 (!q||(x.from+' '+x.to+' '+x.domain).toLocaleLowerCase('zh-Hant').includes(q)));
 page=0;render();
}
function cell(row,text,kind){
 const td=document.createElement('td');td.textContent=String(text);
 if(kind==='domain'){const tag=document.createElement('span');tag.className='tag';tag.textContent=String(text);td.textContent='';td.appendChild(tag);}
 row.appendChild(td);return td;
}
function render(){
 const per=Math.max(1,Number($('pagesize').value)||50),pages=Math.max(1,Math.ceil(filtered.length/per));
 if(page>=pages)page=pages-1;
 const root=$('results');root.textContent='';
 const chunk=filtered.slice(page*per,page*per+per);
 for(const item of chunk){
  const row=document.createElement('tr');
  cell(row,item.from);cell(row,item.to);cell(row,item.domain,'domain');cell(row,item.status);
  const td=document.createElement('td');
  const b=document.createElement('button');b.type='button';b.textContent='複製';
  b.setAttribute('aria-label','複製 '+item.from+' 與 '+item.to);
  b.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(item.from+' → '+item.to);b.textContent='已複製';}
    catch(_){b.textContent='請手動選取文字';}
  });td.appendChild(b);row.appendChild(td);root.appendChild(row);
 }
 $('stats').textContent='共有 '+poolCount()+' 筆資料，符合條件 '+filtered.length+' 筆；本頁 '+chunk.length+' 筆。注意：候選詞不會自動轉換。';
 $('pageInfo').textContent=(page+1)+' / '+pages;
 $('prev').disabled=page===0;$('next').disabled=page>=pages-1;
}
function poolCount(){return $('status').value==='approved'?data.approved.length:data.entries.length;}
for(const name of ['q','domain','status','pagesize'])$(name).addEventListener('input',filter);
$('prev').addEventListener('click',()=>{if(page>0){page--;render();}});
$('next').addEventListener('click',()=>{if((page+1)*Number($('pagesize').value)<filtered.length){page++;render();}});
filter();
})();
</script></body></html>
